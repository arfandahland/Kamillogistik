name: Uji otomatis
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Periksa tipe
        run: npx tsc --noEmit -p apps/web
      - name: Uji unit
        run: npm test -w @kamil/core
      - name: Build
        run: npm run build -w @kamil/web
        env:
          SITE_URL: https://kamillogistik.com
